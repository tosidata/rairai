name: macOS R-devel check

on:
  push:
    branches: [check/macos-r-devel]

permissions:
  contents: read

jobs:
  macos-r-devel:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      R_KEEP_PKG_SOURCE: 'yes'

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel

      - name: Verify native R-devel
        shell: bash
        run: |
          sw_vers
          uname -m
          Rscript -e 'print(R.version); stopifnot(R.version$arch %in% c("aarch64", "arm64"), grepl("development", R.version$status, ignore.case = TRUE))'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          install-quarto: 'true'

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Build and check source tarball
        shell: bash
        run: |
          out="$RUNNER_TEMP/rairai-mac-check"
          tmp=$(mktemp -d "$RUNNER_TEMP/rairai-tmp.XXXXXX")
          mkdir -p "$out" "$tmp/real"
          ln -s "$tmp/real" "$tmp/alias"
          cd "$out"
          R CMD build "$GITHUB_WORKSPACE"
          shasum -a 256 rairai_*.tar.gz | tee SHA256SUMS

          # Match the temporary path spelling that reproduced the CRAN failures.
          export TMPDIR="$tmp/alias/"
          Rscript -e 'cat("tempdir():", tempdir(), "\n"); stopifnot(grepl("/alias//Rtmp", tempdir(), fixed = TRUE))'
          R CMD check --as-cran rairai_*.tar.gz
          test -s rairai.Rcheck/tests/testthat.Rout

      - name: Save check logs and tarball checksum
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rairai-macos-r-devel
          path: |
            ${{ runner.temp }}/rairai-mac-check/SHA256SUMS
            ${{ runner.temp }}/rairai-mac-check/rairai.Rcheck/*.log
            ${{ runner.temp }}/rairai-mac-check/rairai.Rcheck/00install.out
            ${{ runner.temp }}/rairai-mac-check/rairai.Rcheck/tests/testthat.Rout*
